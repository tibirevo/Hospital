<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Appointments</title></head>
<body>
<h1>Appointments List</h1>
<p><a th:href="@{/appointment/new}">Add New Appointment</a></p>
<table border="1">
    <thead>
    <tr><th>ID</th><th>Patient ID</th><th>Department ID</th><th>Room ID</th><th>Admission Date</th><th>Status</th><th>Actions</th></tr>
    </thead>
    <tbody>
    <tr th:each="item : ${appointments}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.patientId}"></td>
        <td th:text="${item.departmentId}"></td>
        <td th:text="${item.roomId}"></td>
        <td th:text="${item.admissionDate}"></td>
        <td th:text="${item.status}"></td>
        <td>
            <a th:href="@{'/appointment/' + ${item.id}}">Details</a> |
            <a th:href="@{'/appointment/' + ${item.id} + '/edit'}">Edit</a> |
            <form th:action="@{'/appointment/' + ${item.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
