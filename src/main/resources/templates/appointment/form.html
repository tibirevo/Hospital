<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Appointment</title>
</head>
<body>
<h1>Create Appointment</h1>

<form th:action="@{/appointment}" th:object="${appointment}" method="post">
    <div>
        <label>ID:</label>
        <input type="text" th:field="*{id}" />
    </div>
    <div>
        <label>Patient ID:</label>
        <input type="text" th:field="*{patientId}" />
    </div>
    <div>
        <label>Department ID:</label>
        <input type="text" th:field="*{departmentId}" />
    </div>
    <div>
        <label>Room ID:</label>
        <input type="text" th:field="*{roomId}" />
    </div>
    <div>
        <label>Admission Date:</label>
        <input type="datetime-local" th:field="*{admissionDate}" />
    </div>
    <div>
        <label>Status:</label>
        <input type="text" th:field="*{status}" />
    </div>
    <button type="submit">Save</button>
</form>

<p><a th:href="@{/appointment}">Back to List</a></p>
</body>
</html>
