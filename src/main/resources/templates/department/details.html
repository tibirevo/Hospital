<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Department Details</title></head>
<body>
<h1>Department Details</h1>
<p><strong>ID:</strong> <span th:text="${department.id}"></span></p>
<p><strong>Name:</strong> <span th:text="${department.name}"></span></p>
<p><strong>Hospital ID:</strong> <span th:text="${department.hospitalId}"></span></p>
<p><a th:href="@{'/department/' + ${department.id} + '/edit'}">Edit</a> | <a th:href="@{/department}">Back to List</a></p>
</body>
</html>
