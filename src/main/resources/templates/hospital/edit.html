<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Hospital</title></head>
<body>
<h1>Edit Hospital</h1>
<form th:action="@{'/hospital/' + ${hospital.id} + '/edit'}" th:object="${hospital}" method="post">
    <div><label>ID:</label><input type="text" th:field="*{id}" readonly /></div>
    <div><label>Name:</label><input type="text" th:field="*{name}" /></div>
    <div><label>City:</label><input type="text" th:field="*{city}" /></div>
    <div><label>Address:</label><input type="text" th:field="*{address}" /></div>
    <div><label>Phone Number:</label><input type="text" th:field="*{phoneNumber}" /></div>
    <button type="submit">Update</button>
</form>
<p><a th:href="@{/hospital}">Back to List</a></p>
</body>
</html>
