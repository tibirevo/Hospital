<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nurses</title>
</head>
<body>
    <h1>Nurses List</h1>
    <p><a th:href="@{/nurse/new}">Add New Nurse</a></p>

    <table border="1">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department ID</th>
            <th>Qualification Level</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${nurses}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.name}"></td>
            <td th:text="${item.departmentId}"></td>
            <td th:text="${item.qualificationLevel}"></td>
            <td>
                <form th:action="@{'/nurse/' + ${item.id} + '/delete'}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</body>
</html>
