<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Nurses</title></head>
<body>
<h1>Nurses List</h1>
<p><a th:href="@{/nurse/new}">Add New Nurse</a></p>
<table border="1">
    <thead>
    <tr>
        <th>ID</th><th>Name</th><th>Department ID</th><th>Qualification</th><th>Shift</th><th>Experience</th><th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${nurses}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.name}"></td>
        <td th:text="${item.departmentId}"></td>
        <td th:text="${item.qualificationLevel}"></td>
        <td>
            <a th:href="@{'/nurse/' + ${item.id}}">Details</a> |
            <a th:href="@{'/nurse/' + ${item.id} + '/edit'}">Edit</a> |
            <form th:action="@{'/nurse/' + ${item.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
