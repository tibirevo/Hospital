<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Medical Staff Appointment</title>
</head>
<body>
<h1>Create Medical Staff Appointment</h1>

<form th:action="@{/medicalstaffappointment}" th:object="${medicalStaffAppointment}" method="post">
    <div>
        <label>ID:</label>
        <input type="text" th:field="*{id}" />
    </div>
    <div>
        <label>Appointment ID:</label>
        <input type="text" th:field="*{appointmentId}" />
    </div>
    <div>
        <label>Medical Staff ID:</label>
        <input type="text" th:field="*{medicalStaffId}" />
    </div>
    <button type="submit">Save</button>
</form>

<p><a th:href="@{/medicalstaffappointment}">Back to List</a></p>
</body>
</html>
