<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medical Staff Appointments</title>
</head>
<body>
<h1>Medical Staff Appointments List</h1>
<p><a th:href="@{/medicalstaffappointment/new}">Add New Medical Staff Appointment</a></p>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Appointment ID</th>
        <th>Medical Staff ID</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${medicalStaffAppointments}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.appointmentId}"></td>
        <td th:text="${item.medicalStaffId}"></td>
        <td>
            <form th:action="@{'/medicalstaffappointment/' + ${item.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
