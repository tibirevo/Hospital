<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rooms</title>
</head>
<body>
<h1>Rooms List</h1>
<p><a th:href="@{/room/new}">Add New Room</a></p>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Number</th>
        <th>Capacity</th>
        <th>Department ID</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${rooms}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.number}"></td>
        <td th:text="${item.capacity}"></td>
        <td th:text="${item.departmentId}"></td>
        <td th:text="${item.status}"></td>
        <td>
            <form th:action="@{'/room/' + ${item.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
