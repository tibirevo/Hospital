<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Patient Details</title></head>
<body>
<h1>Patient Details</h1>
<p><strong>ID:</strong> <span th:text="${patient.id}"></span></p>
<p><strong>Name:</strong> <span th:text="${patient.name}"></span></p>
<p><strong>Birth Date:</strong> <span th:text="${patient.birthDate}"></span></p>
<p><strong>Diagnosis:</strong> <span th:text="${patient.diagnosis}"></span></p>
<p><a th:href="@{'/patient/' + ${patient.id} + '/edit'}">Edit</a> | <a th:href="@{/patient}">Back to List</a></p>
</body>
</html>
